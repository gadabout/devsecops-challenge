apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookings-api
  namespace: bookings
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bookings-api
  namespace: bookings
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bookings-api
  namespace: bookings
subjects:
  - kind: ServiceAccount
    name: bookings-api
    namespace: bookings
roleRef:
  kind: Role
  name: bookings-api
  apiGroup: rbac.authorization.k8s.io
