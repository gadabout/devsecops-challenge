name: Deploy

on:
  push:
    branches: ["**"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  CLUSTER: bookings-production
  SERVICE: bookings-api
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/bookings-github-deploy-production
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push the image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/peek/bookings-api:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Roll the service
        run: aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment

      - name: Notify Slack
        run: |
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"Deployed ${GITHUB_SHA} to production\"}"
