services:
  bookings-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://peek:hunter2@db:5432/bookings
      - JWT_SECRET=dev-secret-change-me
      - DEBUG=true
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=peek
      - POSTGRES_PASSWORD=hunter2
      - POSTGRES_DB=bookings
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peek -d bookings"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
